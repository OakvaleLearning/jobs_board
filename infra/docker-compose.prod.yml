# Production override for VPS hosting.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#
# The base file already builds the production (runtime) image stages, so there is
# NOTHING to build at container startup here. This override only adds:
#   - restart: unless-stopped on every long-running service
#   - the nginx TLS listener (:443), its config, and the Let's Encrypt cert mounts
#
# Prereqs:
#   - A production ../.env (secrets, DATABASE_URL, REDIS_URL, NEXT_PUBLIC_API_URL, provider keys).
#   - TLS certs issued into ./certbot (run infra/init-letsencrypt.sh once — see DEPLOYMENT.md).
#   - GUI tools (adminer, redis-commander) are dev-only and never start in production.

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      NODE_ENV: production

  frontend:
    restart: unless-stopped
    environment:
      NODE_ENV: production

  nginx:
    restart: unless-stopped
    # Base binds :80 via nginx (default NGINX_HOST_PORT) is NOT set in base, so we
    # publish both here. Compose concatenates ports across files, so we do not also
    # re-declare :80 anywhere else.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
