name: oakvale-jobs

# Base (production-shaped) stack. Images are built from multi-stage Dockerfiles and
# run compiled output — NO source bind-mounts, NO build-at-startup.
#
#   Production:  docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#   Development: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml  up --build
#
# The dev override re-adds hot-reload bind-mounts, dev commands and GUI tools.
# nginx ports + config are supplied by the overrides (they differ: dev = HTTP only,
# prod = HTTP + TLS), because Compose concatenates (never removes) ports/volumes.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oakvale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oakvale}
      POSTGRES_DB: ${POSTGRES_DB:-oakvale_jobs}
    ports: ['${POSTGRES_HOST_PORT:-5433}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-oakvale} -d ${POSTGRES_DB:-oakvale_jobs}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_HOST_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
    ports: ['${BACKEND_HOST_PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # node:22-slim has no wget/curl — use Node's global fetch for the healthcheck.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time — set in the root .env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports: ['${FRONTEND_HOST_PORT:-3001}:3000']
    depends_on: [backend]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  nginx:
    image: nginx:alpine
    # ports + nginx.conf are provided by the dev/prod override (they differ).
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
