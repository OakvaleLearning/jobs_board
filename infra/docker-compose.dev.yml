# Development override — hot-reload DX on top of the base stack.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up --build
#   (or `npm run dev` from the repo root)
#
# Builds the `deps` stage (full dev dependencies: tsx, next, drizzle-kit), bind-mounts
# source for live reload, and runs the watch/dev commands. GUI tools are dev-only.

services:
  backend:
    build:
      target: deps
    environment:
      NODE_ENV: development
    working_dir: /app/backend
    command: ['sh', '-c', 'npm run db:migrate && npx tsx watch src/app.ts']
    volumes:
      - ../backend:/app/backend
      - ../packages:/app/packages
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
      # Preserve the image's (hoisted) node_modules under the bind-mounted source.
      - /app/backend/node_modules

  frontend:
    build:
      target: deps
    environment:
      NODE_ENV: development
    working_dir: /app/frontend
    command: ['npx', 'next', 'dev', '-p', '3000', '-H', '0.0.0.0']
    volumes:
      - ../frontend:/app/frontend
      - ../packages:/app/packages
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/frontend/node_modules
      - /app/frontend/.next

  nginx:
    ports: ['${NGINX_HOST_PORT:-80}:80']
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

  adminer:
    image: adminer:latest
    ports: ['${ADMINER_HOST_PORT:-8080}:8080']
    depends_on: [postgres]

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports: ['${REDIS_COMMANDER_HOST_PORT:-8081}:8081']
    depends_on: [redis]
