events {}

# First-boot config used ONLY by infra/init-letsencrypt.sh to answer the
# Let's Encrypt HTTP-01 challenge before any certificate exists. It has no :443
# block, so nginx starts even with no cert on disk (avoiding the bootstrap trap).
http {
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 404;
    }
  }
}
